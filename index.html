<!doctype html>
<html lang="es" style="background:#000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="1990 Arcade — Snake, Breakout, Invaders y Tetris retro neón." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a1a'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%2300f0ff'%3E▶%3C/text%3E%3C/svg%3E" />
    <title>1990 Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app" class="min-h-screen">
      <header class="text-center pt-12 pb-8">
        <h1 class="arcade-title">1990 ARCADE</h1>
        <p class="text-muted mt-4">Snake · Breakout · Invaders · Tetris jugables.</p>
      </header>
      <main class="max-w-5xl mx-auto px-6 pb-16">
        <div id="hub-cols">
          <div id="games-grid" class="grid gap-6"></div>
          <aside id="side-board" class="game-card board-card" style="display:none">
            <p class="text-xs text-muted">RANKING ONLINE</p>
            <h2 class="text-xl font-bold mt-1">TOP 5</h2>
            <div class="mt-2 text-sm">
              <label>JUGADOR <input id="player-name" maxlength="12" /></label>
            </div>
            <div id="top-list" class="mt-2 text-sm text-muted">Cargando ranking…</div>
          </aside>
        </div>
        <footer class="text-center mt-12 text-muted text-sm">
          <p>R = reiniciar · Esc = volver al hub · v0.3.0</p>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
